apiVersion: apps/v1
kind: Deployment
metadata:
  name: effectops-web
  labels:
    app: effectops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: effectops-web
  template:
    metadata:
      labels:
        app: effectops-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/taeyoungk-dev/custom_effect-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: effectops-web
  ports:
    - name: http
      port: 80
      targetPort: http
